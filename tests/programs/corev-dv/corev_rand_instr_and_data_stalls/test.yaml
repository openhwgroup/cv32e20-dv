# Test definition YAML for generated corev arithmetic base test

name: corev_rand_instr_and_data_stalls
uvm_test: uvmt_$(CV_CORE_LC)_firmware_test_c
description: >
    Random instruction test generated by corev-dv, with randomized OBI stalls on
    both the instruction fetch and load/store buses in the same simulation
plusargs: >
    +random_fetch_toggle
    +max_both_stall
